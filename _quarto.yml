project:
  type: book
  output-dir: docs


# --------------------------------------------------
# Book metadata
# --------------------------------------------------

book:
  title: "FastMAPOL Algorithm Theoretical Basis Document"
  subtitle: "Aerosol, Ocean, and Land Retrievals from PACE Multi-Angle Polarimetry"

  author:
    - name: Meng Gao
      affiliations:
        - ref: nasa
        - ref: ssai
        
    - name: Pengwang Zhai
      affiliations:
        - ref: umbc

    - name: Kamal Aryal
      affiliations:
        - ref: nasa
        - ref: umbc
        
    - name: Kirk Knobelspiesse
      affiliations:
        - ref: nasa

    - name: Bryan Franz
      affiliations:
        - ref: nasa

  date: today
  date-format: "YYYY-MM-DD"

  # Documentation-style navigation
  search: true
  page-navigation: true

  sidebar:
    style: docked
    background: light
    collapse-level: 2

  chapters:
    - index.md
    - chapters/fastmapol_summary.md
    - chapters/fastmapol_retrieval.md
    - chapters/fastmapol_product.md
    - chapters/fastmapol_tutorial.md
    - chapters/fastmapol_validation_spexone_v3.md
    - chapters/fastmapol_validation_harp2_ditl.md
    - chapters/fastmapol_validation_harp2_v4.md

  appendices:
    - chapters/fastmapol_appendix_intro.md
    - chapters/fastmapol_pace_simulator.md
    - chapters/fastmapol_neural_network.md
    - chapters/fastmapol_aerosol_size.md
    - chapters/fastmapol_aerosol_component.md
    - chapters/fastmapol_uncertainty_correlation.md
    - chapters/fastmapol_model_ocean.md
    - chapters/fastmapol_ocean_color.md
    - chapters/fastmapol_model_land.md


# --------------------------------------------------
# Author affiliations
# --------------------------------------------------

affiliations:
  - id: nasa
    name: NASA Goddard Space Flight Center
    department: Ocean Ecology Laboratory
    city: Greenbelt
    state: MD
    country: USA

  - id: ssai
    name: Science Systems and Applications, Inc.
    city: Lanham
    state: MD
    country: USA

  - id: umbc
    name: University of Maryland, Baltimore County
    city: Baltimore
    state: MD
    country: USA


# --------------------------------------------------
# Document metadata
# --------------------------------------------------

version: "v1.0"
institution: "NASA Goddard Space Flight Center (GSFC)"
mission: "PACE"


# --------------------------------------------------
# Bibliography and numbering
# --------------------------------------------------

bibliography: bib/lmfit5.bib
link-citations: true

number-sections: true
number-depth: 3

crossref:
  chapters: true


# --------------------------------------------------
# Output formats
# --------------------------------------------------

format:

  html:
    theme: cosmo

    toc: true
    toc-depth: 3
    toc-location: right

    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true

    page-layout: article

    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 260px
      gutter-width: 1.5rem

    css: atbd/styles.css

  pdf:
    keep-tex: true

    # Technical-report style
    documentclass: scrreprt
    papersize: letter
    fontsize: 11pt

    toc: true
    toc-depth: 3
    lof: true
    lot: true

    colorlinks: true
    linkcolor: blue
    citecolor: blue
    urlcolor: blue

    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in

    include-in-header: atbd/header.tex

    # Custom PDF title page
    template-partials:
      - atbd/title.tex